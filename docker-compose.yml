version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_URL=http://localhost:3003
    depends_on:
      - secure-executor
    networks:
      - app-network

  # Secure code executor service
  secure-executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://localhost:3001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /app/secure-temp:noexec,nosuid,size=100m
    ulimits:
      nproc: 10
      nofile: 100
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16